version: "3.8"

services:

  db:
    image: mariadb:10.11
    container_name: glpi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: glpi_root
      MYSQL_DATABASE: glpidb
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpi_pass
    volumes:
      - db_data:/var/lib/mysql

  glpi:
    image: diouxx/glpi
    container_name: glpi
    restart: always
    ports:
      - "80:80"
    volumes:
      - glpi_data:/var/www/html/glpi
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: glpi-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: glpi
      PMA_PASSWORD: glpi_pass
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
  glpi_data:
